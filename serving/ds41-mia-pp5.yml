# TabbyAPI config: layout PP5 — the same model split by layers over the five CMP 170HX
# (exllamav3 device placement, no tensor parallel; the repo's n4x layout over 4 cards,
# extended to five). MTP draft head on card 4, 1M-token FP16 cache, one slot.
# Card budget check (GiB): 8 layers x 4.74 + KV(1M)/5 ~12 + embed/head 1.2 = ~51.3;
# card 4 also carries the MTP: 51.3 + 6.8 = 58.1 <= 58 cap (64 physical).
network:
  host: 127.0.0.1
  port: 1920
  disable_auth: true
  disable_fetch_requests: true
  send_tracebacks: false
  api_servers: ["OAI"]
logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
model:
  model_dir: /home/dkp/models/1017-mia-2p9
  model_name: DeepSeek-V4.1-Flash-1017-EXL3-2.9bpw
  backend: exllamav3
  max_seq_len: 1048576
  cache_size: 1048576
  max_batch_size: 8        # up to 8 concurrent sequences (shared 1M-token pool)
  chunk_size: 4096
  gpu_split_auto: false    # limits per card, in GB; exllamav3 places layers to fit them
  gpu_split: [54, 54, 54, 54, 48]
  reasoning: true
  tool_format: deepseek_v41
  start_in_reasoning: always
  template_vars_default:
    enable_thinking: true
    reasoning_effort: high
memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 0
  cuda_malloc_async: true
draft_model:
  draft_mode: mtp
  draft_gpu_split: [0, 0, 0, 0, 12]   # MTP 6.75 GiB + cache, on card 4
  dynamic_draft: true
